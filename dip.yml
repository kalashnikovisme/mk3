# yaml-language-server: $schema=https://raw.githubusercontent.com/bibendi/dip/refs/heads/master/schema.json
version: '8.0'

compose:
  files:
    - .dockerdev/compose.yml
  project_name: fighting-ai

interaction:
  shell:
    description: Open a shell in the app container
    service: app
    command: bash
    compose:
      run_options: [no-deps]

  ruby:
    description: Run ruby in the app container
    service: app
    command: ruby
    compose:
      run_options: [no-deps]

  bundle:
    description: Run bundler in the app container
    service: app
    command: bundle
    compose:
      run_options: [no-deps]

  rspec:
    description: Run RSpec tests
    service: app
    command: bundle exec rspec
    compose:
      run_options: [no-deps]

  rubocop:
    description: Run RuboCop linter
    service: app
    command: bundle exec rubocop
    compose:
      run_options: [no-deps]

  learn:
    description: "PPO training. Usage: dip learn [match-name] [debug]  e.g. dip learn sub-zero-vs-sindel debug"
    service: app
    command: bundle exec ruby bin/learn

  learn_from_ppo:
    description: "Resume PPO training from a checkpoint. Usage: dip learn_from_ppo <ppo_path> [match-name] [debug]"
    service: app
    command: bundle exec ruby bin/learn_from_ppo

  fight:
    description: "PPO vs PPO match. Usage: dip fight <state_file> <ppo_file_1> <ppo_file_2>"
    service: app
    command: bundle exec ruby bin/fight

  learn_watch:
    description: "PPO training with live Xephyr window on host desktop. Usage: dip learn_watch [match-name]"
    service: app_watch
    command: bundle exec ruby bin/learn

  retroarch:
    description: Launch RetroArch with the MK3 ROM and snes9x core
    service: app
    command: >-
      retroarch
      -L /usr/lib/x86_64-linux-gnu/libretro/snes9x_libretro.so
      -S /app/data/matches/
      -e 0
      /app/mk3.sfc

  scenario:
    description: Run a scenario script against a live match state
    service: app
    command: bundle exec ruby bin/scenario

  scenario_watch:
    description: Run a scenario script with live Xephyr window on host desktop
    service: app_watch
    command: bundle exec ruby bin/scenario

  scenario_debug:
    description: Run scenario and dump full WRAM snapshot to /app/data/memory every frame
    service: app
    command: bundle exec ruby bin/scenario --memory-debug

  "memory:analyze":
    description: Auto-discover WRAM addresses (P1/P2 X, distance, facing, health, timer)
    service: app
    command: bundle exec ruby bin/memory_analyze

  "memory:verify":
    description: Verify candidate addresses with 120-frame motion sequences
    service: app
    command: bundle exec ruby bin/memory_verify

  "memory:find-p2":
    description: Discover P2 X coordinate by correlating WRAM against confirmed P1 X series
    service: app
    command: bundle exec ruby bin/memory_find_p2

  "memory:verify-known-addresses":
    description: Verify published candidates — P1 health 0x36D4, P2 health 0x3898, timer 0x3BD4
    service: app
    command: bundle exec ruby bin/memory_verify_known

  watch-match:
    description: Watch a recorded match replay
    service: app
    command: bundle exec ruby bin/watch-match

  play-vs-ai:
    description: Play against the trained AI
    service: app
    command: bundle exec ruby bin/play-vs-ai

provision:
  - dip compose build
  - dip compose run --rm --no-deps app bundle install
  - dip compose run --rm --no-deps app pip3 install -r requirements.txt
