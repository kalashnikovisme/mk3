services:
  app:
    build:
      context: ..
      dockerfile: .dockerdev/Dockerfile.dev
    working_dir: /app
    volumes:
      - ..:/app
      - bundle:/usr/local/bundle
      - pip:/usr/local/pip
      - ../data:/app/data
    environment:
      ROM_PATH: /app/mk3.sfc
      CORE_PATH: /usr/lib/x86_64-linux-gnu/libretro/snes9x_libretro.so
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      AI_LOG:
      VISION:
      LEARN_EMPTY_EPISODE_FRAMES:
      SHOW_ERRORS:

  app_gpu:
    extends:
      service: app
    gpus: all

  app_watch:
    extends:
      service: app_gpu
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
    environment:
      DISPLAY_HOST: "${DISPLAY:-:0}"
      XAUTHORITY: /root/.Xauthority

volumes:
  bundle:
  pip:
